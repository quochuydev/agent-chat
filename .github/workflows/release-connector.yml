name: Release connector

# Packages the video/ connector into a downloadable tarball and publishes it as a
# GitHub Release, so users can install it without cloning the repo:
#
#   curl -fsSL https://raw.githubusercontent.com/quochuydev/agent-chat/main/install.sh | bash
#
# Triggers on a version tag (v1.2.3) or a manual run (Actions → Release connector → Run).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for a manual release (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write # create releases + upload assets

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build connector tarball
        id: pack
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="agent-chat-connector-${VERSION}"
          # Stage video/ under a versioned dir; exclude runtime cruft and venvs so the
          # tarball is small and clean. install.sh strips the top dir on extract.
          mkdir -p "dist/${NAME}"
          tar -C video \
            --exclude='.venv' --exclude='.venv-api' \
            --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='jobs.db' --exclude='api/runs' \
            --exclude='images' --exclude='*.wav' \
            -cf - . | tar -C "dist/${NAME}" -xf -
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          echo "tarball=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-chat-connector-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Connector ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
          body: |
            Local video connector for the AI Video Agent.

            **Install (no git clone):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            Then start it: `cd ~/agent-chat-connector && ./run_api.sh` (serves :3333).

            Full voiceover/image generation needs Apple Silicon (MLX); `setup.sh` builds
            the model venv automatically there. See RUN.md.
