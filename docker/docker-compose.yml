# AI Video Agent — single-service deployment (Dokploy-ready).
#
#   web → Next.js chat UI + agent + job runners (TTS/Imagen calls, OpenCut assembly),
#         public on :3334. No separate backend: every generation step is a cloud API
#         call, run in-process by the same persistent Node server.
#
# Env: set OPENAI_API_KEY and DATABASE_URL (and optionally GEMINI_API_KEY for images)
# in Dokploy's Environment settings or a .env file beside this compose. See .env.example.

services:
  web:
    build:
      context: ../web
      dockerfile: ../docker/Dockerfile.web
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the environment}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the environment}
      # Enables image generation (Google Imagen). Get a key at https://aistudio.google.com.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IMAGEN_MODEL: ${IMAGEN_MODEL:-imagen-4.0-fast-generate-001}
      # Cost guardrails (hard-capped by the job request validation).
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-30}
      MAX_IMAGES_PER_VIDEO: ${MAX_IMAGES_PER_VIDEO:-10}
    volumes:
      - web_runs:/app/.data/runs # produced artifacts (audio/images/project files)
    ports:
      - "3334:3334"
    restart: unless-stopped

volumes:
  web_runs:
